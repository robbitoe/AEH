name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Long temporary paths on Windows
        # The runner's TEMP uses an 8.3 short name (RUNNER~1) while Git reports long
        # paths, and tests compare both. runner.temp has no short names.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Git identity for test repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -timeout 80m ./...
