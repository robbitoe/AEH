<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-label="AEH map: an idea is refined into a spec book, the human approves features, the engine triages and builds each task in a verified loop, and a living wiki under every stage keeps the memory.">
  <style>
    .bg { fill: #f5f7fa; }
    .ink { fill: #1b2230; }
    .mut { fill: #5a6576; }
    .box { fill: #ffffff; stroke: #c6cfdb; stroke-width: 1.2; }
    .dash { stroke-dasharray: 5 4; }
    .ln { stroke: #3d4757; stroke-width: 1.6; fill: none; }
    .lnd { stroke: #3d4757; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .ah { fill: #3d4757; }
    .zA { fill: #4f5bd5; fill-opacity: .07; stroke: #4f5bd5; stroke-opacity: .45; }
    .zB { fill: #c27c00; fill-opacity: .08; stroke: #c27c00; stroke-opacity: .5; }
    .zC { fill: #0e8a78; fill-opacity: .07; stroke: #0e8a78; stroke-opacity: .45; }
    .zM { fill: #8b4fcf; fill-opacity: .07; stroke: #8b4fcf; stroke-opacity: .45; }
    .hA { fill: #3d48c4; } .hB { fill: #9a6200; } .hC { fill: #0b7363; } .hM { fill: #7440b3; }
    .loop { fill: #0e8a78; fill-opacity: .06; stroke: #0e8a78; stroke-width: 1.4; }
    .hum { fill: #c27c00; }
    .humt { fill: #ffffff; }
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t { font-size: 15px; font-weight: 700; }
    .s { font-size: 12px; }
    .z { font-size: 13px; font-weight: 800; letter-spacing: 1.5px; }
    .l { font-size: 11px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #12161c; }
      .ink { fill: #e7ebf1; }
      .mut { fill: #9aa4b4; }
      .box { fill: #1b2129; stroke: #3a4452; }
      .ln, .lnd { stroke: #b4bdca; }
      .ah { fill: #b4bdca; }
      .hA { fill: #9aa3ff; } .hB { fill: #f0b445; } .hC { fill: #4fd1bb; } .hM { fill: #c39af2; }
      .zA, .zB, .zC, .zM { fill-opacity: .12; }
      .loop { fill-opacity: .1; }
      .hum { fill: #f0b445; }
      .humt { fill: #12161c; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="ah"/>
    </marker>
    <g id="h"><circle r="10" class="hum"/><text y="4" text-anchor="middle" class="l humt">H</text></g>
  </defs>

  <rect width="1200" height="860" rx="16" class="bg"/>

  <!-- legend -->
  <use href="#h" x="1040" y="44"/>
  <text x="1056" y="48" class="s mut">human decides here</text>

  <!-- ZONE 1: DISCOVER -->
  <rect x="20" y="20" width="270" height="580" rx="14" class="zA"/>
  <text x="40" y="48" class="z hA">1 · DISCOVER</text>
  <text x="40" y="66" class="s mut">idea → spec book</text>

  <rect x="40" y="100" width="230" height="70" rx="10" class="box"/>
  <text x="56" y="128" class="t ink">Idea</text>
  <text x="56" y="150" class="s mut">a vague note or an explicit brief</text>
  <use href="#h" x="262" y="100"/>

  <path d="M155 170 V198" class="ln" marker-end="url(#a)"/>

  <rect x="40" y="200" width="230" height="90" rx="10" class="box"/>
  <text x="56" y="228" class="t ink">Refine</text>
  <text x="56" y="250" class="s mut">the engine asks questions,</text>
  <text x="56" y="267" class="s mut">researches, proposes options</text>
  <use href="#h" x="262" y="200"/>

  <path d="M155 290 V323" class="ln" marker-end="url(#a)"/>

  <rect x="40" y="325" width="230" height="180" rx="10" class="box"/>
  <text x="56" y="353" class="t ink">Spec book</text>
  <text x="56" y="377" class="s mut">• product vision and rules</text>
  <text x="56" y="397" class="s mut">• features, one spec each</text>
  <text x="56" y="417" class="s mut">• acceptance criteria</text>
  <text x="56" y="437" class="s mut">• data model</text>
  <text x="56" y="457" class="s mut">• HTML mockups</text>
  <text x="56" y="487" class="l hA">versioned in the wiki</text>

  <!-- ZONE 2: APPROVE -->
  <rect x="305" y="20" width="180" height="580" rx="14" class="zB"/>
  <text x="322" y="48" class="z hB">2 · APPROVE</text>
  <text x="322" y="66" class="s mut">the human, per feature</text>

  <rect x="320" y="325" width="150" height="110" rx="10" class="box"/>
  <text x="336" y="353" class="t ink">Feature review</text>
  <text x="336" y="377" class="s mut">approve, change</text>
  <text x="336" y="395" class="s mut">or drop each</text>
  <text x="336" y="413" class="s mut">feature</text>
  <use href="#h" x="462" y="325"/>

  <path d="M270 380 H318" class="ln" marker-end="url(#a)"/>
  <text x="294" y="372" text-anchor="middle" class="l mut">sends</text>
  <path d="M395 325 V245 H272" class="ln" marker-end="url(#a)"/>
  <text x="400" y="238" class="l mut">changes</text>

  <rect x="320" y="465" width="150" height="80" rx="10" class="box dash"/>
  <text x="336" y="491" class="t ink">Live review</text>
  <text x="336" y="512" class="s mut">specs keep evolving</text>
  <text x="336" y="529" class="s mut">while code is built</text>

  <!-- ZONE 3: BUILD -->
  <rect x="505" y="20" width="675" height="580" rx="14" class="zC"/>
  <text x="525" y="48" class="z hC">3 · BUILD</text>
  <text x="525" y="66" class="s mut">autonomous until the goal is met</text>

  <rect x="525" y="100" width="200" height="80" rx="10" class="box"/>
  <text x="541" y="128" class="t ink">Triage</text>
  <text x="541" y="150" class="s mut">trivial · change · new</text>
  <text x="541" y="167" class="s mut">rules can raise, never lower</text>

  <rect x="960" y="100" width="200" height="80" rx="10" class="box"/>
  <text x="976" y="128" class="t ink">Change request</text>
  <text x="976" y="150" class="s mut">to a product that</text>
  <text x="976" y="167" class="s mut">already exists</text>
  <use href="#h" x="1152" y="100"/>
  <path d="M960 140 H727" class="ln" marker-end="url(#a)"/>

  <!-- change/new goes back to discover -->
  <path d="M560 100 V84 H284 V230 H272" class="lnd" marker-end="url(#a)"/>
  <text x="300" y="98" class="l mut">change or new feature → spec first</text>

  <rect x="525" y="325" width="150" height="110" rx="10" class="box"/>
  <text x="541" y="353" class="t ink">Tasks</text>
  <text x="541" y="377" class="s mut">small pieces,</text>
  <text x="541" y="395" class="s mut">one agent each</text>
  <path d="M600 180 V323" class="ln" marker-end="url(#a)"/>
  <text x="608" y="260" class="l mut">trivial</text>
  <path d="M470 380 H523" class="ln" marker-end="url(#a)"/>
  <text x="496" y="372" text-anchor="middle" class="l mut">ok</text>

  <!-- implementation loop -->
  <rect x="700" y="200" width="460" height="330" rx="14" class="loop"/>
  <text x="720" y="226" class="t hC">Implementation loop</text>
  <text x="720" y="244" class="s mut">per task, in an isolated worktree</text>
  <path d="M675 380 H698" class="ln" marker-end="url(#a)"/>

  <rect x="720" y="262" width="190" height="60" rx="10" class="box"/>
  <text x="736" y="288" class="t ink">Code</text>
  <text x="736" y="308" class="s mut">an agent CLI writes it</text>

  <rect x="950" y="262" width="190" height="60" rx="10" class="box"/>
  <text x="966" y="288" class="t ink">Gates</text>
  <text x="966" y="308" class="s mut">hash · scope · build · test</text>

  <rect x="950" y="350" width="190" height="76" rx="10" class="box"/>
  <text x="966" y="376" class="t ink">Reviewers</text>
  <text x="966" y="396" class="s mut">QA · Security</text>
  <text x="966" y="414" class="s mut">+ DBA when data changes</text>

  <rect x="720" y="350" width="190" height="76" rx="10" class="box"/>
  <text x="736" y="376" class="t ink">Goal met?</text>
  <text x="736" y="396" class="s mut">acceptance tests</text>
  <text x="736" y="414" class="s mut">derived from the spec</text>

  <path d="M910 292 H948" class="ln" marker-end="url(#a)"/>
  <path d="M1045 322 V348" class="ln" marker-end="url(#a)"/>
  <path d="M950 388 H912" class="ln" marker-end="url(#a)"/>
  <path d="M815 350 V324" class="ln" marker-end="url(#a)"/>
  <text x="823" y="341" class="l mut">no: retry with feedback</text>

  <rect x="720" y="446" width="420" height="64" rx="10" class="box dash"/>
  <text x="736" y="472" class="t ink">Stuck?</text>
  <text x="736" y="493" class="s mut">next profile → pause and ask → resume where it stopped</text>
  <use href="#h" x="1132" y="446"/>

  <rect x="880" y="548" width="280" height="44" rx="10" class="box"/>
  <text x="896" y="575" class="t ink">Verified branch</text>
  <text x="1030" y="575" class="s mut">you merge it</text>
  <use href="#h" x="1152" y="548"/>
  <path d="M1020 530 V546" class="ln" marker-end="url(#a)"/>
  <text x="1028" y="542" class="l mut">yes</text>

  <!-- read/write links to memory -->
  <path d="M155 604 V646" class="lnd" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M395 604 V646" class="lnd" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M760 604 V646" class="lnd" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="165" y="630" class="l mut">read · write</text>
  <text x="405" y="630" class="l mut">read · write</text>
  <text x="770" y="630" class="l mut">read · write</text>

  <!-- MEMORY -->
  <rect x="20" y="650" width="1160" height="190" rx="14" class="zM"/>
  <text x="40" y="678" class="z hM">MEMORY · LIVING WIKI</text>
  <text x="250" y="678" class="s mut">every stage reads it · only the runner writes it · local · not published by default</text>

  <rect x="40" y="700" width="320" height="120" rx="10" class="box"/>
  <text x="56" y="728" class="t ink">Raw sources</text>
  <text x="56" y="752" class="s mut">ideas, briefs, conversations,</text>
  <text x="56" y="770" class="s mut">answers to questions</text>
  <text x="56" y="800" class="l hM">immutable, append-only</text>

  <path d="M360 760 H393" class="ln" marker-end="url(#a)"/>
  <text x="377" y="752" text-anchor="middle" class="l mut">ingest</text>

  <rect x="395" y="700" width="420" height="120" rx="10" class="box"/>
  <text x="411" y="728" class="t ink">Wiki</text>
  <text x="456" y="728" class="s mut">kept by the engine, read by you</text>
  <text x="411" y="752" class="s mut">product · features and specs vX.Y · decisions</text>
  <text x="411" y="770" class="s mut">architecture · data model · mockups · glossary</text>
  <text x="411" y="800" class="l hM">index.md · log.md · local history</text>

  <path d="M815 760 H838" class="ln" marker-end="url(#a)"/>

  <rect x="840" y="700" width="320" height="120" rx="10" class="box"/>
  <text x="856" y="728" class="t ink">Drift gate</text>
  <text x="856" y="752" class="s mut">a change to a feature's code must</text>
  <text x="856" y="770" class="s mut">declare it; then its spec version bumps</text>
  <text x="856" y="800" class="l hM">checked without a model</text>
</svg>
